plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
}

version = "${mod_version}+mc26.3"
group = 'lib.kasuga.uip.compose'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin {
    jvmToolchain(25)
    // LDLib2 bundles Kotlin 2.1.20. Limit the API used by the adapter to that runtime.
    compilerOptions.apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.firstdark.dev/snapshots'
        content { includeGroup 'com.lowdragmc.ldlib2' }
    }
    google()
}

neoForge.version = project.neo_version_26_3

sourceSets.main.kotlin.setSrcDirs(['src/minecraft26.3/kotlin'])
sourceSets.main.resources.setSrcDirs(['src/minecraft26.3/resources'])

dependencies {
    api(project(':external:uip:ldlib')) { transitive = false }
    compileOnly(project(':modules:multiversion')) { transitive = false }
    compileOnly 'maven.modrinth:ldlib:Yj7iArC5'
    compileOnlyApi('com.lowdragmc.ldlib2:ldlib2-compose-26.3:26.3.0.1') { transitive = false }
    compileOnlyApi('org.jetbrains.compose.runtime:runtime-desktop:1.8.2') { transitive = false }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}

processResources {
    Map properties = [mod_version: project.version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
