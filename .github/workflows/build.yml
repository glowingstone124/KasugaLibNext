name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Allow reusing older caches (not just exact key matches) and
          # let pushes write cache entries so non-default branches don't cold-start.
          gradle-home-cache-strict-match: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      # Linux is the primary reference runner: full multi-project compile, tests, javadoc, release check, and Linux Box3D native
      - name: Full build with Gradle (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew build renderingReleaseCheck

      # Windows and macOS only build the vendored Box3D C JNI library for the universal jar package.
      # Full logic and cross-platform render harness tests run in render-harness.yml.
      - name: Build Box3D native library (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :modules:modelling:buildBox3D

      - name: Build Box3D native library (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew :modules:modelling:buildBox3D

      - name: Upload Box3D native library
        uses: actions/upload-artifact@v4
        with:
          name: box3d-native-${{ runner.os }}-${{ runner.arch }}
          path: modules/modelling/build/native/box3d/resources/native
          if-no-files-found: error

      - name: Upload modelling jar
        # One platform's jar is enough as the base for the universal jar -
        # native libraries for all three platforms are merged in package-universal.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kasuga-modelling-base
          path: modules/modelling/build/libs/kasuga-modelling-*.jar
          if-no-files-found: error

  build-26-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-strict-match: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test Minecraft 26.3
        run: ./gradlew -PkasugaMinecraft=26.3 build renderingReleaseCheck :modules:multiversion:contentTestingClasses :external:slp:javet:shadowJar --console=plain
      - name: Upload Minecraft 26.3 base mod
        uses: actions/upload-artifact@v4
        with:
          name: kasuga-26-3-base
          path: modules/multiversion/build/26.3/libs/kasuga-multiversion-*-all.jar
          if-no-files-found: error
      - name: Upload Minecraft 26.3 adapters
        uses: actions/upload-artifact@v4
        with:
          name: kasuga-26-3-adapters
          path: |
            external/slp/javet/build/26.3/libs/kasuga-javet-*-all.jar
            external/uip/ldlib/build/26.3/libs/kasuga-ldlib-*.jar
            external/uip/ldlib-compose/build/26.3/libs/kasuga-ldlib-compose-*.jar
          if-no-files-found: error
      - name: Verify Minecraft 26.3 headless rendering on Linux
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libopenal1 mesa-vulkan-drivers
          for backend in opengl vulkan; do
            log="$RUNNER_TEMP/kasuga-headless-$backend.log"
            scripts/run-headless-client.sh -PkasugaMinecraft=26.3 -PkasugaTestHeadless=true \
              "-PkasugaHeadlessGraphics=$backend" "-PkasugaClientDirectory=run/26.3-headless-$backend" --console=plain | tee "$log"
            grep -Fq "KASUGA_HEADLESS_PASS graphics=$backend driver=offscreen hidden,unpresented,world-ticks,final-gui-readback,hdr-format-switch" "$log"
          done

  package-26-3-universal:
    needs: [build, build-26-3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: kasuga-26-3-base
          path: build/kasuga-26-3
      - uses: actions/download-artifact@v4
        with:
          pattern: box3d-native-*
          path: build/box3d-universal/native
          merge-multiple: true
      - name: Bundle and verify Box3D native libraries
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/kasuga-26-3/kasuga-multiversion-*-all.jar)
          test "${#jars[@]}" -eq 1
          jar uf "${jars[0]}" -C build/box3d-universal native
          mv "${jars[0]}" build/kasuga-minecraft-26.3-universal.jar
          entries=$(jar tf build/kasuga-minecraft-26.3-universal.jar)
          grep -qE '^native/linux-[^/]+/libkasuga_box3d\.so$' <<< "$entries"
          grep -qE '^native/windows-[^/]+/kasuga_box3d\.dll$' <<< "$entries"
          grep -qE '^native/macos-[^/]+/libkasuga_box3d\.dylib$' <<< "$entries"
      - name: Upload universal Minecraft 26.3 mod
        uses: actions/upload-artifact@v4
        with:
          name: kasuga-minecraft-26.3-universal
          path: build/kasuga-minecraft-26.3-universal.jar
          if-no-files-found: error

  # Package a single jar containing the box3d native libraries for all
  # platforms without re-running the Gradle/NeoForge pipeline.
  package-universal:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download modelling jar
        uses: actions/download-artifact@v4
        with:
          name: kasuga-modelling-base
          path: build/modelling-base

      - name: Download all Box3D native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: box3d-native-*
          path: build/box3d-universal/native
          merge-multiple: true

      - name: Merge native libraries into universal jar
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find build/modelling-base -name 'kasuga-modelling-*.jar' | head -n1)
          echo "Merging native libraries into ${jar_file}"
          # Native artifacts are downloaded under build/box3d-universal/native/<classifier>/,
          # and the runtime looks them up at /native/<os>-<arch>/<lib>, so the "native"
          # directory itself must be kept as the top-level entry inside the jar.
          jar uf "${jar_file}" -C build/box3d-universal .
          mv "${jar_file}" build/kasuga-modelling-universal.jar

      - name: Verify native libraries are inside the universal jar
        shell: bash
        run: |
          set -euo pipefail
          found=$(jar tf build/kasuga-modelling-universal.jar | grep -cE '^native/.+\.(dll|so|dylib)$')
          echo "Native libraries bundled: ${found}"
          test "${found}" -ge 3
          jar tf build/kasuga-modelling-universal.jar | grep -E '^native/.+\.(dll|so|dylib)$' | sort

      - name: Upload universal modelling jar
        uses: actions/upload-artifact@v4
        with:
          name: kasuga-modelling-universal
          path: build/kasuga-modelling-universal.jar
          if-no-files-found: error
