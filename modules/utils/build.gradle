plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

dependencies {
    // Minecraft supplies Gson at runtime; do not bundle a duplicate into core's shaded JAR.
    compileOnlyApi 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}


boolean modernMinecraft = providers.gradleProperty('kasugaMinecraft').getOrElse('1.21.1') == '26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(modernMinecraft ? 25 : 21)

test {
    useJUnitPlatform()
    systemProperty "logger.level.io.micronaut.context", "DEBUG"
    systemProperty "logger.level.io.micronaut.inject", "DEBUG"
}

neoForge {
    // Specify the version of NeoForge to use.
    version = modernMinecraft ? project.neo_version_26_3 : project.neo_version

    if (!modernMinecraft) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {}

    unitTest {
        // Enable JUnit support in the moddev plugin
        enable()
    }
}


configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'FMLModType': "GAMELIBRARY"
        )
    }
}
