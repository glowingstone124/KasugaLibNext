plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow' version '9.0.2'
    id 'builder.kasuga.generator'
}

import builder.kasuga.MicronautServiceShadowTransformer

group = mod_group_id
version = "${mod_version}+mc26.3"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
}

sourceSets.main.java.srcDir(rootProject.file('modules/core/src/shared/java'))
sourceSets.main.java.srcDir(rootProject.file('modules/modelling/src/shared/java'))
sourceSets.main.resources.srcDir(rootProject.file('modules/modelling/src/sharedResources'))
sourceSets.test.java.srcDir(rootProject.file('modules/core/src/sharedTest/java'))

tasks.withType(Sync).configureEach {
    // Gradle does not fingerprint the line filters used to adapt shared Java sources.
    inputs.file(project.buildFile).withPathSensitivity(PathSensitivity.RELATIVE)
}

// Sync the shared registration sources with the names used by the 26.3 mappings.
// Behavioral API changes are handled in the handwritten platform adapters.
def registrationDirectory = layout.buildDirectory.dir('generated/sources/registration/java')
def templateDirectory = layout.buildDirectory.dir('generated/sources/registration/templates')
def updateMinecraftNames = { String line ->
    line.replaceAll(/\bResourceLocation\b/, 'Identifier')
            .replace('net.minecraft.Util', 'net.minecraft.util.Util')
            .replace('.location()', '.identifier()')
            .replaceAll(/\bnoCollission\b/, 'noCollision')
            .replaceAll(/\bsetNoRepair\b/, 'setNoCombineRepair')
}
def prepareRegistrationSources = tasks.register('prepareRegistrationSources', Sync) {
    from(rootProject.file('modules/core/src/main/java')) {
        include 'lib/kasuga/KasugaLibRegistry.java',
                'lib/kasuga/registration/**',
                'lib/kasuga/content/device/**',
                'lib/kasuga/content/document/**',
                'lib/kasuga/core/codec/KasugaCodec.java',
                'lib/kasuga/core/networking/rpc/**',
                'lib/kasuga/client/ClientBlockUpdateHooks.java',
                'lib/kasuga/core/rendering/ISpecialRenderingItem.java',
                'lib/kasuga/content/graph/GraphCycleDetector.java'
        exclude 'lib/kasuga/content/device/GlobalDeviceManager.java',
                'lib/kasuga/content/device/GlobalDeviceSavedData.java',
                'lib/kasuga/content/document/DocumentComponentRenderer.java',
                'lib/kasuga/content/document/DocumentItemRenderer.java',
                'lib/kasuga/core/networking/rpc/RpcTransport.java',
                'lib/kasuga/registration/beans/rendering/**',
                'lib/kasuga/registration/core/DefaultClientRegisterContextDispatchers.java',
                'lib/kasuga/registration/minecraft/common/DeferredFillHolder.java',
                'lib/kasuga/registration/minecraft/common/RegistrationPlatform.java',
                'lib/kasuga/registration/minecraft/fluid/ManagedFluidClientExtensions.java',
                'lib/kasuga/registration/minecraft/payload/PayloadPlatform.java',
                'lib/kasuga/registration/minecraft/entity/EntityRendererBuilder.java',
                'lib/kasuga/registration/minecraft/block_entity/BlockEntityRendererBuilder.java'
    }
    from(rootProject.file('modules/data-driven/src/main/java')) {
        exclude 'lib/kasuga/registration/data_driven/builder/RegistrationResources.java',
                'lib/kasuga/registration/data_driven/diagnostics/DiagnosticPermissions.java',
                'lib/kasuga/registration/data_driven/source/ModJarContentSource.java'
    }
    filter(updateMinecraftNames)
    into(registrationDirectory)
}
def prepareDataDrivenTests = tasks.register('prepareDataDrivenTests', Sync) {
    from(rootProject.file('modules/data-driven/src/test/java')) {
        // The 1.21.1 command, block state and contentTesting fixtures have a separate host.
        exclude '**/DataDiagnosticsCommandsTest.java', '**/BlockStateRegistrationTest.java',
                '**/StatePropertyApiTest.java', '**/FactoryRegistryTest.java',
                '**/JsonTreeBuilderIndexPathTest.java', '**/ModJarContentSourceTest.java'
    }
    filter(updateMinecraftNames)
    into(layout.buildDirectory.dir('generated/sources/dataDriven/test'))
}
sourceSets.test.java.srcDir(prepareDataDrivenTests)
def prepareBox3DTests = tasks.register('prepareBox3DTests', Sync) {
    from(rootProject.file('modules/modelling/src/test/java')) {
        include '**/physics/box3d/NativeBox3DTest.java', '**/physics/core/Box3DCollisionIntegrationTest.java'
    }
    into(layout.buildDirectory.dir('generated/sources/box3d/test'))
}
// Run portable physics tests outside the NeoForge module layer so their package-private
// fixtures share the render-core JVM package.
def box3dTest = sourceSets.create('box3dTest')
box3dTest.java.srcDir(prepareBox3DTests)
tasks.register('box3dTest', Test) {
    group = 'verification'
    description = 'Runs the portable Box3D JNI and collision integration tests.'
    testClassesDirs = box3dTest.output.classesDirs
    classpath = box3dTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'box3dTest' }

def prepareRegistrationTemplates = tasks.register('prepareRegistrationTemplates', Sync) {
    from(rootProject.file('modules/core/src/codeTemplate/java')) {
        include 'template/lib/kasuga/registration/minecraft/**',
                'template/lib/kasuga/core/networking/rpc/**'
    }
    filter(updateMinecraftNames)
    into(templateDirectory)
}
def prepareModelSources = tasks.register('prepareModelSources', Sync) {
    from(rootProject.file('modules/modelling/src/main/java')) {
        include 'lib/kasuga/rendering/models/mc/dynamic/fsm/**',
                'lib/kasuga/rendering/models/mc/dynamic/MinecraftModelRuntime.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/MinecraftBlockPhysics.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/MinecraftBlockRagdollEnvironment.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/MinecraftBlockRigidBody.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/MinecraftRagdoll*.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/PhysicsCommands.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/PhysicsLightSampler.java',
                'lib/kasuga/rendering/models/mc/dynamic/physics/RagdollDeployment.java',
                'lib/kasuga/rendering/models/mc/typo/gltf_entry/GltfModelManifest.java',
                'lib/kasuga/scene/MinecraftStage.java',
                'lib/kasuga/scene/SceneGround.java',
                'lib/kasuga/scene/SceneGroundRegistrar.java',
                'lib/kasuga/scene/SceneProps.java',
                'lib/kasuga/rendering/models/mc/scene/BlueprintImporters.java',
                'lib/kasuga/rendering/models/mc/typo/pmx_entry/ZipHelper.java',
                'lib/kasuga/rendering/models/mc/typo/pmx_entry/ZipResource.java',
                'lib/kasuga/rendering/models/mc/typo/pmx_entry/ZipMeta.java',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/data/be/**',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/data/je/**',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/data/MCMeshData.java',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/loader/be/**',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/loader/je/**',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/loader/CubeVerticesMapper.java',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/loader/MCMeshBuilder.java',
                'lib/kasuga/rendering/effect/DuplicatePolicy.java',
                'lib/kasuga/rendering/effect/RenderRegistration.java',
                'lib/kasuga/rendering/effect/PipelineRegistryCore.java',
                'lib/kasuga/rendering/effect/WorldRenderPipeline.java',
                'lib/kasuga/rendering/effect/EffectHandle.java',
                'lib/kasuga/rendering/effect/EffectRenderer.java',
                'lib/kasuga/rendering/effect/RenderEffect.java',
                'lib/kasuga/rendering/effect/EffectRenderPipeline.java',
                'lib/kasuga/rendering/effect/ClientEffectRuntime.java',
                'lib/kasuga/rendering/effect/particle/**',
                'lib/kasuga/rendering/effect/builtin/water/WaterSurface.java',
                'lib/kasuga/rendering/effect/builtin/cloud/CumulonimbusCloud.java',
                'lib/kasuga/rendering/effect/builtin/blackhole/BlackHoleEffect.java',
                'lib/kasuga/rendering/effect/builtin/blackhole/BlackHoleShaderProvider.java',
                'lib/kasuga/rendering/effect/post/PostProcessTargetDescriptor.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraph.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraphFrame.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraphPass.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraphPassDescriptor.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraphPrepare.java',
                'lib/kasuga/rendering/effect/post/graph/PostProcessGraphTarget.java'
        exclude 'lib/kasuga/rendering/models/mc/dynamic/fsm/AnimationBlockEntity.java',
                'lib/kasuga/rendering/models/mc/dynamic/fsm/KasugaModelPipelines.java',
                'lib/kasuga/rendering/models/mc/java_and_bedrock/loader/je/JETextureLayer.java',
                'lib/kasuga/rendering/effect/particle/instance/opengl/**'
    }
    filter { String line ->
        // The 26.3 host supplies a native RenderPass and graph-owned targets.
        if (line.contains('import lib.kasuga.rendering.effect.pipeline.CompiledRenderPipeline;') ||
                line.contains('public CompiledRenderPipeline compiledPipeline()') ||
                line.contains('PostProcessTargetPool.getInstance().clear()') ||
                line.contains('import lib.kasuga.rendering.effect.post.PostProcessTargetPool;')) return null
        updateMinecraftNames(line).replace('new ChunkPos(pos)', 'ChunkPos.containing(pos)')
                .replace('context.camera().getPosition()', 'context.camera().pos')
                .replace('context.partialTick().getGameTimeDeltaPartialTick(false)', 'context.partialTick()')
                .replace('ResourceLocationArgument', 'IdentifierArgument')
                .replace('level.getMinBuildHeight()', 'level.getMinY()')
                .replace('PushReaction.BLOCK', 'PushReaction.IMMOVEABLE')
                .replace('.isViewBlocking((state, level, pos) -> false)', '.isViewBlocking((state, level, pos, camera) -> false)')
    }
    filesMatching('**/PhysicsLightSampler.java') {
        filter { String line ->
            if (line == 'import net.minecraft.client.renderer.LightTexture;') return null
            line.replace('import net.minecraft.client.renderer.LevelRenderer;', 'import net.minecraft.util.LightCoordsUtil;')
                    .replace('LevelRenderer.getLightColor(', 'LightCoordsUtil.getLightCoords(')
                    .replace('LightTexture.pack(', 'LightCoordsUtil.pack(')
                    .replaceAll(/\.isSolidRender\(level, \w+\)/, '.isSolidRender()')
                    .replace('level.getSkyDarken(1f)',
                            'level.environmentAttributes().getValue(net.minecraft.world.attribute.EnvironmentAttributes.SKY_LIGHT_FACTOR, center, null)')
        }
    }
    into(layout.buildDirectory.dir('generated/sources/models/java'))
}
def prepareScriptingSources = tasks.register('prepareScriptingSources', Sync) {
    from(rootProject.file('modules/scripting/src/main/java')) {
        exclude 'lib/kasuga/scripting/client/**'
    }
    filter { String line ->
        updateMinecraftNames(line).replace('Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen(')
                .replace('Minecraft.getInstance().screen', 'Minecraft.getInstance().gui.screen()')
    }
    into(layout.buildDirectory.dir('generated/sources/scripting/java'))
}
def prepareScriptingTests = tasks.register('prepareScriptingTests', Sync) {
    from(rootProject.file('modules/scripting/src/test/java')) {
        include 'lib/kasuga/test/scripting/fsm/**', 'lib/kasuga/test/scripting/ticket/**'
    }
    into(layout.buildDirectory.dir('generated/sources/scripting/test'))
}
sourceSets.test.java.srcDir(prepareScriptingTests)
sourceSets.main.java.srcDir(prepareScriptingSources)
sourceSets.main.java.srcDir(prepareModelSources)
sourceSets.main.java.srcDir(prepareRegistrationSources)
sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/codegen/java/main'))
useGenerator(templates: templateDirectory, sources: [registrationDirectory],
        dependsOn: [prepareRegistrationSources, prepareRegistrationTemplates])
tasks.named('sourcesJar') { dependsOn 'runGenerator' }

tasks.named('test') { useJUnitPlatform() }

sourceSets {
    blackHoleDemo {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    contentTesting {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.blackHoleDemo.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.blackHoleDemo.output
    }
}

def prepareBlackHoleDemoSources = tasks.register('prepareBlackHoleDemoSources', Sync) {
    from(rootProject.file('modules/modelling/src/contentTesting/java')) {
        include 'test/kasuga/modelling/demo/blackhole/BlackHoleDemo.java',
                'test/kasuga/modelling/demo/blackhole/LensView.java'
    }
    into layout.buildDirectory.dir('generated/sources/blackHoleDemo/java')
}
sourceSets.blackHoleDemo.java.srcDir(prepareBlackHoleDemoSources)

tasks.named('processBlackHoleDemoResources', ProcessResources) {
    from(rootProject.file('modules/modelling/src/contentTesting/resources')) {
        include 'assets/kasuga_lib/shaders/include/black_hole_demo.glsl'
    }
}

tasks.named('processContentTestingResources', ProcessResources) {
    from(rootProject.file('modules/modelling/src/contentTesting/resources')) {
        include 'assets/kasuga_lib/models/components/light_locator.bbmodel',
                'assets/kasuga_lib/models/components/emitter_smoke.bbmodel'
    }
    from(rootProject.file('modules/core/src/contentTesting/resources')) {
        include 'assets/kasuga_lib/textures/block/test_fluid_still.png',
                'assets/kasuga_lib/textures/block/test_fluid_flow.png'
    }
}

configurations {
    bundledLibrary
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    box3dTestImplementation project(':modules:render-core')
    box3dTestImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    box3dTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api(project(':modules:inject')) { transitive = false }
    bundledLibrary(project(':modules:inject')) { transitive = false }
    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    contentTestingAnnotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'
    api('io.micronaut:micronaut-inject:4.9.10') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    runtimeOnly('io.micronaut:micronaut-aop:4.9.10') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    bundledLibrary('io.micronaut:micronaut-aop:4.9.10') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    api(project(':modules:shader')) { transitive = false }
    api(project(':modules:render-core')) { transitive = false }
    api(project(':modules:formula')) { transitive = false }
    api(project(':modules:utils')) { transitive = false }
    runtimeOnly 'de.javagl:jgltf-model:2.0.4'
    runtimeOnly 'de.javagl:jgltf-impl-v2:2.0.4'
    bundledLibrary(project(':modules:shader')) { transitive = false }
    bundledLibrary(project(':modules:render-core')) { transitive = false }
    bundledLibrary(project(':modules:formula')) { transitive = false }
    bundledLibrary(project(':modules:utils')) { transitive = false }
    bundledLibrary 'de.javagl:jgltf-model:2.0.4'
    bundledLibrary 'de.javagl:jgltf-impl-v2:2.0.4'
}

neoForge {
    version = project.neo_version_26_3

    runs {
        client {
            client()
            String graphicsSmoke = providers.gradleProperty('kasugaGraphicsSmoke').getOrElse('')
            if (!(graphicsSmoke in ['', 'vulkan', 'opengl'])) {
                throw new GradleException("Unknown graphics API for the smoke client: ${graphicsSmoke}")
            }
            gameDirectory = file(graphicsSmoke.isEmpty() ? 'run/26.3-client' : "run/26.3-smoke-${graphicsSmoke}")
            if (!graphicsSmoke.isEmpty()) {
                programArguments.addAll '--width', '960', '--height', '540',
                        '--graphicsBackend', graphicsSmoke.toUpperCase(Locale.ROOT)
                systemProperty 'kasuga.graphicsSmoke', graphicsSmoke
            }
        }
        server {
            server()
            gameDirectory = file('run/26.3-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.blackHoleDemo
            if (!providers.gradleProperty('kasugaGraphicsSmoke').getOrElse('').isEmpty()) {
                sourceSet sourceSets.contentTesting
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    Map properties = [
            minecraft_version_range: '[26.3]',
            neo_version            : neo_version_26_3,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('shadowJar') {
    configurations = [project.configurations.bundledLibrary]
    mergeServiceFiles()
    transform(MicronautServiceShadowTransformer) {}
    relocate 'io.micronaut', 'lib.kasuga.vendors.io.micronaut'
    relocate 'jakarta.inject', 'lib.kasuga.vendors.jakarta.inject'
    relocate 'jakarta.annotation', 'lib.kasuga.vendors.jakarta.annotation'
    relocate 'lib.kasuga.inject', 'lib.kasuga.vendors.inject'
    relocate 'de.javagl', 'lib.kasuga.vendors.javagl'
    relocate 'com.fasterxml.jackson', 'lib.kasuga.vendors.jackson'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
}

tasks.named('assemble') { dependsOn 'shadowJar' }

apply from: rootProject.file('gradle/box3d.gradle')
